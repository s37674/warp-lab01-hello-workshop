name: Build .NET project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: ./HelloWorkshop.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        shell: bash
        run: bash scripts/check-repository.sh "$PROJECT_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        shell: bash
        run: dotnet restore "$PROJECT_PATH"

      - name: Build project
        shell: bash
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Run project
        shell: bash
        run: dotnet run --project "$PROJECT_PATH" --configuration Release --no-build

      - name: Publish project
        shell: bash
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-restore --output ./artifacts/app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: ./artifacts/app
          if-no-files-found: error
          retention-days: 7
